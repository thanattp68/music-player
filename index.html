<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Music">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <title>Music</title>
</head>
<body>
  <header class="top">
    <h1>เพลงของฉัน</h1>
    <label class="add-btn" for="file-input">+ เพิ่มเพลง</label>
    <input id="file-input" type="file" accept=".mp3,.m4a,audio/mpeg,audio/mp4,audio/x-m4a" multiple hidden>
  </header>

  <main>
    <p id="status" class="status" hidden></p>
    <ul id="library" class="library"></ul>
    <p id="empty" class="empty" hidden>ยังไม่มีเพลง กด “เพิ่มเพลง” เพื่อเลือกไฟล์ .mp3 หรือ .m4a</p>
  </main>

  <section class="player">
    <div class="now">
      <div id="now-title" class="now-title">ยังไม่ได้เลือกเพลง</div>
    </div>
    <div class="seek">
      <span id="cur">0:00</span>
      <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="ตำแหน่งเพลง">
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <button id="btn-shuffle" class="ctl" aria-label="สุ่มเพลง">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      </button>
      <button id="btn-prev" class="ctl" aria-label="ก่อนหน้า">
        <svg viewBox="0 0 24 24" class="fill"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button id="btn-play" class="ctl main" aria-label="เล่น/หยุด">
        <svg id="ic-play" viewBox="0 0 24 24" class="fill"><path d="M8 5v14l11-7z"/></svg>
        <svg id="ic-pause" viewBox="0 0 24 24" class="fill" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button id="btn-next" class="ctl" aria-label="ถัดไป">
        <svg viewBox="0 0 24 24" class="fill"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
      <button id="btn-repeat" class="ctl" aria-label="เล่นซ้ำ">
        <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
        <small id="repeat-one" hidden>1</small>
      </button>
    </div>
  </section>

  <audio id="audio" preload="auto" playsinline></audio>
  <script src="app.js"></script>
</body>
</html>
